<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg1: #ffb6d9;
            --bg2: #ff8ec7;

            --frame: #ff5aa5;
            --frameDark: #c61d6a;

            --panel: #fff3fb;
            --panel2: #ffd2ea;

            --btn: #ff88c4;
            --btn2: #ff66b5;

            --op: #ffc1e1;
            --ink: #4b0030;

            --success: #1d6b56;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% 10%, #ffe6f4 0 22%, transparent 50%),
                radial-gradient(circle at 80% 20%, #ffd1ea 0 18%, transparent 45%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
            font-family: system-ui, sans-serif;
            overflow: hidden;
            /* Prevent scrollbars from huge modal backdrop */
        }

        .stage {
            width: min(600px, 100%);
            padding: 12px;
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 95vh;
            /* keep it inside viewport */
            display: block;
            shape-rendering: crispEdges;
            image-rendering: pixelated;
            overflow: visible;
            /* Allow modal backdrop to spill out */
        }

        /* clickable buttons */
        .btn {
            cursor: pointer;
        }

        .btn:active .btnContent {
            transform: translateY(4px);
        }

        /* Ensure text inside content moves with it */
        .btnContent text {
            pointer-events: none;
            will-change: transform;
        }

        /* Keep shadow stable for "press" effect */

        /* modal entrance */
        .popIn {
            transform-origin: 50% 50%;
            animation: popIn .18s ease-out;
        }

        @keyframes popIn {
            from {
                transform: translateY(10px) scale(.98);
                opacity: .7;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* processing shimmer */
        .blink {
            animation: blink 0.85s steps(2, end) infinite;
        }

        @keyframes blink {
            50% {
                opacity: .35;
            }
        }

        /* Tipped Badge */
        #tippedBadge {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>

<body>
    <div class="stage">
        <svg class="svgWrap" viewBox="0 0 360 520" aria-label="Paywall Calculator SVG">
            <defs>
                <!-- Dither / pixel texture -->
                <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
                    <rect width="8" height="8" fill="transparent"></rect>
                    <rect x="1" y="1" width="1" height="1" fill="rgba(255,255,255,0.35)"></rect>
                    <rect x="5" y="3" width="1" height="1" fill="rgba(255,255,255,0.25)"></rect>
                    <rect x="2" y="6" width="1" height="1" fill="rgba(255,255,255,0.22)"></rect>
                    <rect x="6" y="6" width="1" height="1" fill="rgba(255,255,255,0.18)"></rect>
                </pattern>

                <!-- Scanlines for screen -->
                <pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse">
                    <rect width="1" height="1" fill="rgba(255,90,165,0.18)"></rect>
                    <rect y="1" width="1" height="7" fill="transparent"></rect>

                <!-- Sparkles -->
                <pattern id="spark" width="60" height="60" patternUnits="userSpaceOnUse">

                    <rect x="10" y="12" width="2" height="2" fill="rgba(255,255,255,0.75)"></rect>
                    <rect x="44" y="18" width="2" height="2" fill="rgba(255,255,255,0.55)"></rect>
                    <rect x="24" y="46" width="2" height="2" fill="rgba(255,255,255,0.55)"></rect>
                </pattern>

                <!-- Gradients -->
                <linearGradient id="frameGrad" x1="0" x2="0" y1="0" y2="1">

                    <stop offset="0.35" stop-color="#ffd0e6" />
                    <stop offset="1" stop-color="#ffc0de" />
                </linearGradient>

                <linearGradient id="btnGrad" x1="0" x2="0" y1="0" y2="1">
                    <stop offset="0" stop-color="#fff1fb" />
                    <stop offset="0.55" stop-color="#ffb3da" />

            </defs>

            <!-- HEADER TEXT & BANNER -->

                <text x="0" y="8" text-anchor="middle" font-family="&quot;Press Start 2P&quot;" font-size="16"

            <!-- TIPPED BADGE (Initially Hidden) -->

            <!-- CALC FRAME SHADOW -->

            <g transform="translate(250,118) rotate(10)">
                <rect x="-52" y="-10" width="96" height="48" rx="4" fill="var(--frameDark)" />

            </g>

            <!-- SCREEN SHADOW -->
            <rect x="88" y="152" width="196" height="76" rx="12" fill="rgba(198,29,106,.35)" />
            <!-- SCREEN -->

            <rect x="80" y="144" width="196" height="76" rx="12" fill="url(#scan)" opacity="0.35" />

            <text id="exprText" x="268" y="176" text-anchor="end" clip-path="url(#screenClip)"

                <!-- modal panel shadow -->

                <!-- modal panel -->

                    <rect x="36" y="144" width="272" height="332" rx="16" fill="#ffe5f2" stroke="var(--frame)"

                    <rect x="48" y="156" width="248" height="308" rx="12" fill="transparent"

                    <rect x="56" y="164" width="232" height="292" rx="10" fill="transparent"

                    <text x="172" y="184" text-anchor="middle" font-family="&quot;Press Start 2P&quot;" font-size="10"

                    <text x="172" y="210" text-anchor="middle" font-family="&quot;Press Start 2P&quot;" font-size="9"

                    <rect x="48" y="106" width="248" height="336" rx="12" fill="transparent"

                    <!-- Header -->
                    <text x="172" y="136" text-anchor="middle" font-family="&quot;Press Start 2P&quot;" font-size="12"

                            <g class="btnContent">

                                    stroke="var(--frame)" stroke-width="3" />

                        </g>

                        <!-- Done -->
                        <g class="btn" id="tipDoneBtn" transform="translate(186, 0)">

                                fill="rgba(198,29,106,.35)" />
                            <g class="btnContent">
                                <rect class="btnFace" x="0" y="0" width="90" height="34" rx="8" fill="#40d479"
                                    stroke="var(--frame)" stroke-width="3" />

            <!-- CONFETTI LAYER -->
            <g id="confettiLayer" style="display:none; pointer-events: none;"></g>
        </svg>
    </div>

    <script>
        // --- helpers to create SVG elements ---
        const NS = "http://www.w3.org/2000/svg";
        const $ = (id) => document.getElementById(id);

        function el(name, attrs = {}) {
            const n = document.createElementNS(NS, name);
            for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
            return n;
        }

        // --- calculator state ---
        let expr = "0";
        let pendingAnswer = null;

        const exprText = $("exprText");
        const resText = $("resText");

        const processingLayer = $("processingLayer");
        const modalLayer = $("modalLayer");
        const tipLayer = $("tipLayer");
        const celebrateLayer = $("celebrateLayer");
        let girlMathMessage = ""; // Store the message for later
        // const celebrateExpr = $("celebrateExpr"); // No longer needed
        // const celebrateAns = $("celebrateAns");   // No longer needed
        const confettiLayer = $("confettiLayer");

        function render() {
            // show × ÷ in UI, keep * / in logic
            const shown = expr.replaceAll("*", "×").replaceAll("/", "÷");
            exprText.textContent = shown;
        }

        function safeEval(s) {
            // Implicit multiplication handling:
            // 9( -> 9*(
            s = s.replace(/(\d)\(/g, '$1*(');
            // )9 -> )*9
            s = s.replace(/\)(\d)/g, ')*$1');
            // )( -> )*(
            s = s.replace(/\)\(/g, ')*(');

            if (!/^[0-9+\-*/().\s]+$/.test(s)) throw new Error("Invalid");
            // eslint-disable-next-line no-new-func
            const val = Function('"use strict";return (' + s + ')')();
            if (!Number.isFinite(val)) throw new Error("Math error");
            return val;
        }

        function setResult(txt) {
            let shown = String(txt || "");
            if (shown.length > 9) {
                // simple truncate if too long
                shown = shown.substring(0, 9);
            }
            resText.textContent = shown;
        }

        // --- build keys as SVG ---
        const keys = $("keys");

        const layout = [
            ["AC", "back", "(", ")"],
            ["7", "8", "9", "/"],
            ["4", "5", "6", "*"],
            ["1", "2", "3", "-"],
            ["0", "W0", ".", "+"],
            ["=", "WEQ", "TIP", "WTIP"]
        ];

        // positions inside calc
        const startX = 85;
        const startY = 232;

        // make buttons a bit smaller so height isn’t crazy
        const gap = 6;
        const w = 42;
        const h = 36;

        function addKey(label, x, y, width, height, type = "num") {
            const g = el("g", { class: "btn", transform: `translate(${x} ${y})` });
            g.dataset.label = label;

            const shadow = el("rect", {
                class: "btnShadow",
                x: "8", y: "8",
                width: String(width), height: String(height),
                rx: "6",
                fill: "rgba(198,29,106,.35)"
            });

            // Group moving content
            const content = el("g", { class: "btnContent" });

            const faceFill =
                label === "=" ? "url(#eqGrad)" :
                    (type === "op" || type === "tip") ? "#ffc1e1" :
                        "url(#btnGrad)";

            const face = el("rect", {
                class: "btnFace",
                x: "0", y: "0",
                width: String(width), height: String(height),
                rx: "6",
                fill: faceFill,
                stroke: "var(--frame)",
                "stroke-width": "4"
            });

            const hi = el("rect", {
                x: "8", y: "8",
                width: String(Math.max(14, Math.floor(width * 0.42))),
                height: String(Math.floor(height * 0.35)),
                rx: "2",
                fill: "rgba(255,255,255,0.45)"
            });

            const text = el("text", {
                x: String(width / 2),
                y: String(height / 2 + 9),
                "text-anchor": "middle",
                "font-family": "\"Press Start 2P\"",
                "font-size": (label.length >= 3 ? "12" : "16"),
                fill: "var(--ink)",
                style: "pointer-events: none;" // Ensure clicks go to group
            });

            let shownLabel = label;
            if (label === "/") shownLabel = "÷";
            if (label === "*") shownLabel = "×";
            if (label === "back") shownLabel = "⌫";
            if (label === "TIP") shownLabel = "TIP";

            text.textContent = shownLabel;

            content.appendChild(face);
            content.appendChild(hi);
            content.appendChild(text);

            g.appendChild(shadow);
            g.appendChild(content);

            g.addEventListener("click", () => handleKey(label));
            keys.appendChild(g);
        }

        function handleKey(label) {
            if (label === "AC") {
                expr = "0"; pendingAnswer = null;
                setResult("");
                celebrateLayer.style.display = "none";
                render();
                return;
            }
            if (label === "back") {
                expr = expr.length <= 1 ? "0" : expr.slice(0, -1);
                render();
                return;
            }
            if (label === "TIP") {
                openTipModal();
                return;
            }
            if (label === "=") {
                try {
                    const val = safeEval(expr);
                    // format nice short string
                    let s = String(val);
                    if (s.length > 9) {
                        s = val.toPrecision(6);
                        // remove exponential if possible? 
                        if (String(s).length > 9) s = val.toFixed(6);
                    }
                    // strip trailing zeros
                    if (s.includes('.')) s = s.replace(/\.?0+$/, "");

                    pendingAnswer = s;

                    // --- GIRL MATH LOGIC ---
                    girlMathMessage = "It’s an investment ✨";

                    openModal();
                } catch (e) {
                    setResult("ERR");
                }
                return;
            }

            // normal input, limit length to 24 (simulates scrolling)
            if (expr.length < 24) {
                const ops = ["+", "-", "*", "/"];
                const lastChar = expr.slice(-1);

                // If input is an operator
                if (ops.includes(label)) {
                    // Check if last char was also an operator
                    if (ops.includes(lastChar)) {
                        // Replace the last operator with the new one
                        expr = expr.slice(0, -1) + label;
                    } else {
                        // Append normally
                        expr += label;
                    }
                } else {
                    // Not an operator (numbers, dot, parens), append normally
                    // Special case: Initial "0" replacement
                    if (expr === "0" && /[0-9.]/.test(label)) {
                        expr = (label === ".") ? "0." : label;
                    } else {
                        expr += label;
                    }
                }
            }

            render();
        }

        // Build keys with correct indexing (NO for..of bug)
        for (let r = 0; r < layout.length; r++) {
            const row = layout[r];
            let col = 0;

            for (let i = 0; i < row.length; i++) {
                const item = row[i];

                if (item === "W0" || item === "WEQ" || item === "WTIP") continue;

                const x = startX + col * (w + gap);
                const y = startY + r * (h + gap);

                // Wide 0
                if (item === "0" && row[i + 1] === "W0") {
                    addKey("0", x, y, (2 * w + gap), h, "num");
                    col += 2;
                    continue;
                }

                // Wide =
                if (item === "=" && row[i + 1] === "WEQ") {
                    addKey("=", x, y, (2 * w + gap), h, "eq");
                    col += 2;
                    continue;
                }

                // Wide TIP
                if (item === "TIP" && row[i + 1] === "WTIP") {
                    addKey("TIP", x, y, (2 * w + gap), h, "tip");
                    col += 2;
                    continue;
                }

                const type = (["/", "*", "-", "+", "(", ")"].includes(item)) ? "op" : "num";
                addKey(item, x, y, w, h, type);
                col += 1;
            }
        }

        // --- modal payment options (SVG) ---
        const payOptions = $("payOptions");

        const options = [
            { id: "gcash", label: "GCash", sub: "0912-345-6789", tag: "FASTEST", img: "images/GCash.png" },
            { id: "card", label: "Credit Card", sub: "VISA / MC", tag: "CARD", img: "images/credit.png" },
            { id: "maya", label: "Maya", sub: "tap to “pay”", tag: "CUTE", img: "images/maya.png" },
            { id: "apple", label: "Apple Pay", sub: "FaceID confirmed", tag: "APPLE", img: "images/apple.png" }
        ];

        function addPayOption(o, i) {
            const x = 60, y = 252 + i * 44;

            const g = el("g", { class: "btn", transform: `translate(${x} ${y})` });
            g.dataset.pay = o.id;

            const shadow = el("rect", { class: "btnShadow", x: "8", y: "8", width: "240", height: "34", rx: "8", fill: "rgba(198,29,106,.35)" });

            const content = el("g", { class: "btnContent" });

            const face = el("rect", { class: "btnFace", x: "0", y: "0", width: "240", height: "34", rx: "8", fill: "rgba(255,255,255,0.7)", stroke: "var(--frame)", "stroke-width": "3" });

            // pixel icon block
            const iconShadow = el("rect", { x: "12", y: "10", width: "22", height: "22", rx: "4", fill: "rgba(0,0,0,0.12)" });
            // Image icon
            const icon = el("image", {
                x: "10", y: "8", width: "22", height: "22",
                href: o.img,
                preserveAspectRatio: "xMidYMid meet" // ensure logo fits
            });

            // texts
            const t1 = el("text", { x: "44", y: "22", "font-family": "\"Press Start 2P\"", "font-size": "10", fill: "#4b0030" });
            t1.textContent = o.label;

            const t2 = el("text", { x: "44", y: "32", "font-family": "\"Press Start 2P\"", "font-size": "8", fill: "#4b0030", opacity: "0.75" });
            t2.textContent = o.sub;

            // tag pill
            // Widened to 60 to fit "FASTEST", shifted X left to 174 to stay inside button
            const tagShadow = el("rect", { x: "176", y: "12", width: "60", height: "16", rx: "6", fill: "rgba(0,0,0,0.12)" });
            const tag = el("rect", { x: "174", y: "10", width: "60", height: "16", rx: "6", fill: "#ffe0f0", stroke: "rgba(0,0,0,0.10)", "stroke-width": "2" });
            const tagText = el("text", { x: "204", y: "22", "text-anchor": "middle", "font-family": "\"Press Start 2P\"", "font-size": "8", fill: "#4b0030" });
            tagText.textContent = o.tag;

            g.appendChild(shadow);
            content.appendChild(face);
            content.appendChild(iconShadow);
            content.appendChild(icon);
            content.appendChild(t1);
            content.appendChild(t2);
            content.appendChild(tagShadow);
            content.appendChild(tag);
            content.appendChild(tagText);
            g.appendChild(content);

            g.addEventListener("click", () => fakePay(o.id));
            payOptions.appendChild(g);
        }

        options.forEach(addPayOption);

        // --- REAL TIP LOGIC ---
        const tipAmountsContainer = $("tipAmounts");
        const tipQR = $("tipQR");
        const tippedBadge = $("tippedBadge");

        const tipAmounts = [5, 20, 50, 100];
        let currentTip = 50;

        function renderTipAmounts() {
            tipAmountsContainer.innerHTML = "";
            tipAmounts.forEach((amt, i) => {
                const x = i * 60;
                const isSel = (amt === currentTip);

                const g = el("g", { class: "btn", transform: `translate(${x} 0)` });

                const shadow = el("rect", {
                    class: "btnShadow",
                    x: "4", y: "4",
                    width: "52", height: "30", rx: "8",
                    fill: "rgba(198,29,106,.35)"
                });

                const content = el("g", { class: "btnContent" });

                // Pill shape
                const bg = el("rect", {
                    x: "0", y: "0",
                    width: "52", height: "30", rx: "8",
                    fill: isSel ? "#c61d6a" : "#fff",
                    stroke: "#c61d6a", "stroke-width": "2"
                });

                const txt = el("text", {
                    x: "26", y: "20", "text-anchor": "middle",
                    "font-family": "\"Press Start 2P\"", "font-size": "10",
                    fill: isSel ? "#fff" : "#c61d6a"
                });
                txt.textContent = amt;

                g.appendChild(shadow);
                content.appendChild(bg);
                content.appendChild(txt);
                g.appendChild(content);
                g.addEventListener("click", () => setTipAmount(amt));
                tipAmountsContainer.appendChild(g);
            });
        }

        function setTipAmount(amt) {
            currentTip = amt;
            // Update QR
            tipQR.setAttribute("href", `images/Tip_${amt}.jpg`);
            // Re-render buttons to update highlights
            renderTipAmounts();
        }

        function openTipModal() {
            setTipAmount(50); // reset to default
            tipLayer.style.display = "block";
        }

        // Close (X)
        $("tipCloseBtn").addEventListener("click", () => {
            tipLayer.style.display = "none";
        });

        // Done (Checkmark)
        $("tipDoneBtn").addEventListener("click", () => {
            tipLayer.style.display = "none";

            // Celebration
            const toastLines = celebrateLayer.querySelectorAll("text");
            toastLines[0].textContent = "Thank you bestie!";
            toastLines[1].textContent = "Tipped ✅";

            burstConfetti();
            celebrateLayer.style.display = "block";
            tippedBadge.style.display = "block"; // Show badge on calc

            setTimeout(() => {
                celebrateLayer.style.display = "none";
                // Restore default toast
                toastLines[0].textContent = "Thank you bestie! 💗";
                toastLines[1].textContent = "Answer unlocked";
            }, 4000);
        });

        /*
        async function fakeTip(amount) {

        // close modal
        $("closeModalBtn").addEventListener("click", () => {
            modalLayer.style.display = "none";
        });

        // open modal
        function openModal() {
            modalLayer.style.display = "block";
        }

        // confetti
        let confettiAnimId = null;
        let particles = [];

        function burstConfetti() {
            // clear old
            confettiLayer.innerHTML = "";
            confettiLayer.style.display = "block";
            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            particles = [];

            const count = 80;
            const colors = ["#ff5aa5", "#40d479", "#4aa8ff", "#ffb167", "#ffffff", "#ffd700"];

            for (let i = 0; i < count; i++) {
                const p = {
                    x: 180, // start center
                    y: 200,
                    vx: (Math.random() - 0.5) * 12, // explode out
                    vy: (Math.random() - 0.5) * 12 - 5, // up pop
                    grav: 0.15,
                    drag: 0.96,
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    size: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    el: null
                };

                // SVG element
                const r = el("rect", {
                    x: "0", y: "0",
                    width: String(p.size),
                    height: String(p.size),
                    fill: p.color,
                    rx: "2"
                });

                confettiLayer.appendChild(r);
                p.el = r;
                particles.push(p);
            }

            let start = null;

            function tick(timestamp) {
                if (!start) start = timestamp;
                const dt = timestamp - start;

                let alive = false;
                particles.forEach(p => {
                    // physics
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= p.drag;
                    p.vy += p.grav;
                    p.rot += p.vRot;

                    // render
                    // check bounds roughly (0-360, 0-520)
                    if (p.y < 550) {
                        alive = true;
                        p.el.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${p.rot})`);
                    } else {
                        p.el.style.display = 'none';
                    }
                });

                if (alive && dt < 4000) {
                    confettiAnimId = requestAnimationFrame(tick);
                } else {
                    confettiLayer.style.display = "none";
                }
            }

            confettiAnimId = requestAnimationFrame(tick);
        }

        async function fakePay(method) {
            modalLayer.style.display = "none";

            // processing in screen
            processingLayer.style.display = "block";
            setResult("");

            await new Promise(r => setTimeout(r, 900));
            processingLayer.style.display = "none";

            // show result
            setResult(pendingAnswer ?? "0");

            // celebration overlay inside calc
            burstConfetti();

            // Set custom girl math message
            const toastLines = celebrateLayer.querySelectorAll("text");
            // Standard: "Thank you bestie! 💗" is line [0]
            // Standard: "Answer unlocked" is line [1]
            if (girlMathMessage) {
                toastLines[0].textContent = girlMathMessage;
                toastLines[1].textContent = "Math = Girled";
            } else {
                toastLines[0].textContent = "Thank you bestie! 💗";
                toastLines[1].textContent = "Answer unlocked";
            }

            celebrateLayer.style.display = "block";

            // hide toast after 4 seconds
            setTimeout(() => {
                celebrateLayer.style.display = "none";
            }, 4000);
        }

        // init render
        render();

        // (Optional) click on celebration layer to close it
        // celebrateLayer.addEventListener("click", () => {
        // celebrateLayer.style.display = "none";
